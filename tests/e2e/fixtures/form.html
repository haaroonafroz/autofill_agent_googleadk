<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Application Form</title>
</head>
<body>
  <h1>Apply now</h1>
  <form id="application" onsubmit="window.submitted = true; return false;">
    <label for="fname">First name</label>
    <input id="fname" name="fname" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" />

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Choose...</option>
      <option value="GB">United Kingdom</option>
      <option value="DE">Germany</option>
    </select>

    <label><input id="privacy" type="checkbox" name="privacy" /> I agree to the privacy policy</label>

    <label for="why">Why do you want this job?</label>
    <textarea id="why" name="why" rows="3"></textarea>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" />

    <button id="submit" type="submit">Submit application</button>
  </form>

  <label for="search">Live search</label>
  <input id="search" type="text" oninput="document.getElementById('echo').textContent = this.value" />
  <p>You typed: <span id="echo"></span></p>

  <iframe id="frame" src="frame.html" title="Referee form" width="400" height="120"></iframe>
</body>
</html>
